<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>शिक्षासेतु (ShikshaSetu) - Bridging the Gap Between Students and Education</title>
  <meta name="description" content="ShikshaSetu - Official Maharashtra State Board (Balbharati) Digital Learning Platform for Standards 5, 6, 7, and 8. Interactive simulations, step-by-step solved maths, chapter quizzes, in-browser textbooks, and free PDF downloads.">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fffbeb',
              100: '#fef3c7',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309'
            },
            navy: {
              800: '#1e293b',
              900: '#0f172a',
              950: '#020617'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- jsPDF for Client-side PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen selection:bg-amber-200 dark:selection:bg-amber-900 font-sans">

  <!-- App Mount Root -->
  <div id="app-root">
    <!-- Rendered dynamically by js/app.js -->
    <div class="min-h-screen flex items-center justify-center">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-amber-500"></div>
    </div>
  </div>

  <!-- Scripts in dependency order -->
  <script src="js/data/translations.js"></script>
  <script src="js/data/books.js"></script>
  <script src="js/data/topics.js"></script>
  <script src="js/data/syllabus_std5.js"></script>
  <script src="js/data/syllabus_std6.js"></script>
  <script src="js/data/syllabus_std7.js"></script>
  <script src="js/data/syllabus_std8.js"></script>
  <script src="js/data/syllabus.js"></script>
  <script src="js/data/mathExamples.js"></script>
  <script src="js/components/simulations.js"></script>
  <script src="js/components/mathEngine.js"></script>
  <script src="js/components/pdfGenerator.js"></script>
  <script src="js/components/quiz.js"></script>
  <script src="js/components/auth.js"></script>
  <script src="js/components/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
